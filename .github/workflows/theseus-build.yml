name: NyxRinth App build
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/theseus-build.yml
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/app-lib/**'
      - 'packages/app-macros/**'
      - 'packages/assets/**'
      - 'packages/ui/**'
      - 'packages/utils/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.4.0). Leave empty to auto-increment the minor version from the latest release.'
        type: string
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Using specified version: $VERSION"
          else
            LATEST_TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"

            if [ -z "$LATEST_TAG" ]; then
              VERSION="0.1.0"
              echo "No previous release found, starting at $VERSION"
            else
              LATEST_VERSION="${LATEST_TAG#v}"
              MAJOR="$(echo "$LATEST_VERSION" | cut -d. -f1)"
              MINOR="$(echo "$LATEST_VERSION" | cut -d. -f2)"
              MINOR=$((MINOR + 1))
              VERSION="${MAJOR}.${MINOR}.0"
              echo "Latest release is $LATEST_TAG, bumping minor to $VERSION"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: determine-version
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - platform: macos-latest
            artifact-target-name: universal-apple-darwin
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            artifact-target-name: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check available secrets
        id: check-secrets
        shell: bash
        run: |
          echo "has-apple-cert=${{ secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
          echo "has-tauri-key=${{ secrets.TAURI_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          target: ${{ startsWith(matrix.platform, 'macos') && 'x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "NyxRinth App (dev-${GIT_HASH})",
            "mainBinaryName": "NyxRinth App (dev-${GIT_HASH})",
            "identifier": "NyxRinthApp-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ startsWith(matrix.platform, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ needs.determine-version.outputs.version }}"
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "$APP_VERSION" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "$APP_VERSION" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "$APP_VERSION" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env

      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@v1.8

      - name: Install dependencies
        run: pnpm install

      - name: Set up Windows code signing
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          if [ '${{ secrets.TAURI_PRIVATE_KEY != '' }}' = 'true' ]; then
            choco install jsign --ignore-dependencies # GitHub runners come with a global Java installation already
          else
            dasel delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand'
          fi

      - name: Build macOS app (signed)
        run: pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-release.conf.json
        if: startsWith(matrix.platform, 'macos') && steps.check-secrets.outputs.has-apple-cert == 'true'
        env:
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build macOS app (unsigned)
        run: pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-dev.conf.json
        if: startsWith(matrix.platform, 'macos') && steps.check-secrets.outputs.has-apple-cert == 'false'

      - name: Build Linux app
        run: ${{ secrets.TAURI_PRIVATE_KEY != '' && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json' }}
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Windows app
        run: |
          [System.Convert]::FromBase64String("$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64") | Set-Content -Path signer-client-cert.p12 -AsByteStream
          $env:DIGICERT_ONE_SIGNER_CREDENTIALS = "$env:DIGICERT_ONE_SIGNER_API_KEY|$PWD\signer-client-cert.p12|$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD"
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          ${{ secrets.TAURI_PRIVATE_KEY != '' && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis,updater"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "nsis,updater"' }}
          Remove-Item -Path signer-client-cert.p12 -ErrorAction SilentlyContinue
        if: startsWith(matrix.platform, 'windows')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          DIGICERT_ONE_SIGNER_API_KEY: ${{ secrets.DIGICERT_ONE_SIGNER_API_KEY }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD }}

      - name: Package Linux tarball
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail

          DEB_PATH="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)"
          EXTRACT_DIR="$(mktemp -d)"
          dpkg-deb -x "$DEB_PATH" "$EXTRACT_DIR"

          BIN_PATH="$(find "$EXTRACT_DIR/usr/bin" -maxdepth 1 -type f | head -1)"
          DESKTOP_PATH="$(find "$EXTRACT_DIR/usr/share/applications" -maxdepth 1 -name '*.desktop' | head -1)"
          ICON_128="$(find "$EXTRACT_DIR/usr/share/icons/hicolor/128x128/apps" -maxdepth 1 -type f | head -1)"
          ICON_256="$(find "$EXTRACT_DIR/usr/share/icons/hicolor/256x256@2/apps" -maxdepth 1 -type f | head -1)"

          PKG_PARENT="$(mktemp -d)"
          PKG_DIR="$PKG_PARENT/nyxrinth-app"
          mkdir -p "$PKG_DIR/icons"
          cp "$BIN_PATH" "$PKG_DIR/$(basename "$BIN_PATH")"
          cp "$DESKTOP_PATH" "$PKG_DIR/nyxrinth-app.desktop"
          cp "$ICON_128" "$PKG_DIR/icons/128x128.png"
          cp "$ICON_256" "$PKG_DIR/icons/256x256.png"

          cp .github/scripts/nyxrinth-tarball-install.sh "$PKG_DIR/install.sh"
          chmod +x "$PKG_DIR/install.sh"

          mkdir -p target/release/bundle/tar
          TAR_NAME="$(basename "$DEB_PATH" .deb).tar.gz"
          tar -C "$PKG_PARENT" -czf "target/release/bundle/tar/$TAR_NAME" "nyxrinth-app"
          echo "Created target/release/bundle/tar/$TAR_NAME"

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          path: |
            target/release/bundle/appimage/NyxRinth App_*.AppImage*
            target/release/bundle/deb/NyxRinth App_*.deb*
            target/release/bundle/rpm/NyxRinth App-*.rpm*
            target/release/bundle/tar/NyxRinth App_*.tar.gz*
            target/release/bundle/appimage/NyxRinth App (dev-*)_*.AppImage*
            target/release/bundle/deb/NyxRinth App (dev-*)_*.deb*
            target/release/bundle/rpm/NyxRinth App (dev-*)-*.rpm*
            target/release/bundle/tar/NyxRinth App (dev-*)_*.tar.gz*
            target/universal-apple-darwin/release/bundle/macos/NyxRinth App.app.tar.gz*
            target/universal-apple-darwin/release/bundle/macos/NyxRinth App (dev-*)*.app.tar.gz
            target/universal-apple-darwin/release/bundle/dmg/NyxRinth App (dev-*)*.dmg
            target/universal-apple-darwin/release/bundle/dmg/NyxRinth App_*.dmg*
            target/release/bundle/nsis/NyxRinth App_*-setup.exe*
            target/release/bundle/nsis/NyxRinth App (dev-*)_*-setup.exe*
            target/release/bundle/nsis/NyxRinth App_*-setup.nsis.zip*

  release:
    name: Create release
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all app bundles
        uses: actions/download-artifact@v4
        with:
          pattern: 'App bundle *'
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          mapfile -d '' FILES < <(find artifacts -type f -print0)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No build artifacts were found to release" >&2
            exit 1
          fi

          printf 'Uploading: %s\n' "${FILES[@]}"

          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes \
            "${FILES[@]}"
